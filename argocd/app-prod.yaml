apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-platform-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/anasgrt/LLM-PLATFORM-POC-ARGOCD.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform
  # Prod is manual-sync: promotion happens by editing overlays/prod and
  # confirming the sync in ArgoCD UI.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
