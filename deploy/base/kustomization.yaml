apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources span ai-platform and monitoring namespaces, so we don't set a
# top-level namespace here. Each manifest declares its own namespace, and the
# sample-logs ConfigMap is generated directly into ai-platform.
resources:
  - 00-namespace.yaml
  - 01-qdrant.yaml
  - 02-qwen3-server.yaml
  - 03-embedding-server.yaml
  - 04-rag-app.yaml
  - 05-ingestion-job.yaml
  - 06-ingress.yaml
  - 07-monitoring-namespace.yaml
  - 07-prometheus-rbac.yaml
  - 07-kube-state-metrics-rbac.yaml
  - 07-prometheus.yaml
  - 07-node-exporter.yaml
  - 07-kube-state-metrics.yaml
  - 07-grafana-provisioning.yaml
  - 07-grafana-llm-platform-dashboard.yaml
  - 07-grafana-runtime.yaml
  - 07-monitoring-ingress.yaml
  - 07-argocd-metrics-services.yaml
  - 07-grafana-argocd-dashboard.yaml
  - 08-fluent-bit.yaml
  - 09-log-retention.yaml

configMapGenerator:
  - name: sample-logs
    namespace: ai-platform
    files:
      - sample-logs/infrastructure.log
      - sample-logs/kubernetes-pods.log
      - sample-logs/nginx-access.log
  - name: qwen3-config
    namespace: ai-platform
    literals:
      - MODEL_PATH=Qwen3-4B-Q4_K_M.gguf
      - N_THREADS=2
      - N_THREADS_BATCH=2
      - N_CTX=8192
  - name: embedding-config
    namespace: ai-platform
    literals:
      - EMBED_MODEL=all-MiniLM-L6-v2
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
  - name: rag-app-config
    namespace: ai-platform
    literals:
      - COLLECTION=logs
      - TOP_K=6
      - MAX_CONTEXT_CHARS=1000
      - MAX_TOKENS=300
      - QWEN3_TIMEOUT=300
      - USE_LLM=true

generatorOptions:
  disableNameSuffixHash: true

# In-house images. Overlays set `newTag` to the git SHA pushed by CI.
# Listing them here lets `kustomize edit set image` resolve cleanly.
images:
  - name: ghcr.io/anasgrt/qwen3-server
  - name: ghcr.io/anasgrt/embedding-server
  - name: ghcr.io/anasgrt/rag-app
  - name: ghcr.io/anasgrt/ingestion
