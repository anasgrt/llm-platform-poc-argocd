apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-server
  namespace: ai-platform
  labels:
    app: embedding-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: embedding-server
  template:
    metadata:
      labels:
        app: embedding-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: llm-data
      containers:
        - name: embeddings
          image: ghcr.io/anasgrt/embedding-server
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: EMBED_MODEL
              value: "/models/all-MiniLM-L6-v2"
            - name: MODEL_CACHE
              value: "/models"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          volumeMounts:
            - name: cache
              mountPath: /models
              readOnly: true
          resources:
            requests:
              memory: 1536Mi
              cpu: 150m
            limits:
              memory: 3Gi
              cpu: 500m
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: cache
          hostPath:
            path: /vagrant/prebuilt-models
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-server
  namespace: ai-platform
spec:
  selector:
    app: embedding-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
