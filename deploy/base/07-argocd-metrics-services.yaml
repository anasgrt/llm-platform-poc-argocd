---
# ArgoCD Metrics Services
# These services expose the metrics ports of ArgoCD components so that
# Prometheus (via the kubernetes-service-endpoints scrape job) can discover
# and scrape them automatically.  The existing prometheus.yml already has a
# job named 'kubernetes-service-endpoints' that keeps any service carrying
# the annotation 'prometheus.io/scrape: "true"'.

apiVersion: v1
kind: Service
metadata:
  name: argocd-application-controller-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/component: application-controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: /metrics
spec:
  selector:
    app.kubernetes.io/name: argocd-application-controller
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082
  type: ClusterIP
  clusterIP: None
---
